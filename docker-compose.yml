services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pipelab
      POSTGRES_USER: pipelab
      POSTGRES_PASSWORD: pipelab
    ports: ["5433:5432"]
    volumes: ["pipelab-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipelab -d pipelab"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pipelab:pipelab@postgres:5432/pipelab
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  pipelab-postgres:
